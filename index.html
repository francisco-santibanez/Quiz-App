<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Quiz App</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <main class="quiz-container">
      <header class="quiz-header">
        <div class="progress-wrapper">
          <div id="progress-bar" class="progress-bar"></div>
        </div>
        <span id="question-counter" class="counter">Fråga 1 av 3 </span>
      </header>

      <section id="quiz-body">
        <h1 id="question-text">Frågan laddas...</h1>
        <div id="answer-buttons" class="btn-grid"></div>
      </section>

      <!-- Här skriver man kommentarer -->
      <footer class="quiz-footer">
        <button id="next-btn" class="btn next-btn hide">Nästa fråga</button>
      </footer>
    </main>
    <script src="script.js"></script>
  </body>
</html>
